name: Nutretium Password Recovery Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/password-recovery-ui]
permissions:
  contents: read
concurrency:
  group: password-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Password recovery contract
        run: node scripts/test-password-recovery-ui.js
      - name: Critical syntax
        run: |
          node --check cuenta.js
          node --check netlify/functions/account-security.js
          node --check scripts/test-password-recovery-ui.js
