name: Temporary Lockfile Generator
on:
  push:
    branches: ['hardening/full-security-review-20260920']
permissions:
  contents: write
jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[skip lockgen]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "ci: actualiza lockfile de Playwright [skip lockgen]"
          git push
