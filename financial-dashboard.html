<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Dirección financiera · Nutretium</title><style>:root{--g:#d4af37;--bg:#090909;--p:#111;--line:#2b2718;--t:#f5f2e9;--m:#98938a;--ok:#74ce96;--bad:#ed8585;--warn:#e4b85b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 Inter,system-ui,sans-serif}.wrap{max-width:1450px;margin:auto;padding:24px}.head{display:flex;gap:12px;align-items:center;margin-bottom:18px}.grow{flex:1}.brand{color:var(--g);font-weight:950;letter-spacing:.13em;font-size:11px}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:17px}.card strong{display:block;font-size:25px;margin-top:5px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.section{margin-top:16px}.notice{background:#171407;border:1px solid #453a14;border-radius:13px;padding:14px}.tablewrap{overflow:auto;border:1px solid #282318;border-radius:13px;background:var(--p)}table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid #222;text-align:left}th{font-size:10px;text-transform:uppercase;color:var(--m)}button,.btn{border:1px solid #403815;background:#151515;color:#eee;border-radius:9px;padding:9px 13px;font-weight:850;cursor:pointer;text-decoration:none}.primary{background:var(--g);color:#090909;border-color:var(--g)}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:15px}.head{align-items:flex-start;flex-wrap:wrap}}</style></head><body><main class="wrap"><div class="head"><div><div class="brand">NUTRETIUM · DIRECCIÓN</div><h1 style="margin:4px 0">Panel financiero</h1><div id="meta" class="muted">Datos reales almacenados; no se estiman costes desconocidos.</div></div><div class="grow"></div><a class="btn" href="/enterprise.html#product-costs">Gestionar costes</a><button id="refresh" class="primary">Actualizar</button></div><section id="cards" class="grid"></section><section id="marginNotice" class="section notice"></section><section class="section"><div class="card"><h2 style="margin-top:0">Control operativo</h2><div id="ops" class="grid"></div></div></section><section class="section"><div class="card"><h2 style="margin-top:0">Costes pendientes</h2><p class="muted">Si falta el coste de un SKU, el margen total se marca como NO VALIDADO.</p><div class="tablewrap"><table><thead><tr><th>SKU sin coste</th><th>Acción</th></tr></thead><tbody id="missingRows"></tbody></table></div></div></section><p id="error" class="bad"></p></main><script src="/financial-dashboard.js"></script></body></html>
