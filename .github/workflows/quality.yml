name: Nutretium Build & Enterprise Gate
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'hotfix/**', 'hardening/**', 'final-**', 'release/**']
  pull_request:
    branches: [main]
concurrency:
  group: quality-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --omit=optional
      - name: Build release candidate
        run: node scripts/build-release.js
      - name: Price and cart tests
        run: npm test
      - name: Redsys tests
        run: NUTRETIUM_TEST_MEMORY_BLOBS=true npm run test:redsys
      - name: Catalog tests
        run: npm run test:catalogo
      - name: Admin tests
        run: npm run test:admin
      - name: Account tests
        run: npm run test:cuentas
      - name: Commerce tests
        run: npm run test:commerce
      - name: External readiness tests
        run: npm run test:external-readiness
      - name: Enterprise platform tests
        run: npm run test:enterprise
  deploy-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --omit=optional
      - name: Reproduce exact Netlify build
        run: node scripts/build-release.js
      - name: Audit public artifact
        run: node scripts/audit-public-dist.js
