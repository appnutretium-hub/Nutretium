name: Nutretium AI Control Plane Gate
on:
  push:
    branches: [main, 'feature/ai-control-plane-v1']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ai-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --omit=optional
      - name: AI syntax
        run: |
          node --check netlify/lib/agent-governance.js
          node --check netlify/lib/ai-runtime.js
          node --check netlify/functions/ai-control-plane.js
          node --check netlify/functions/ai-worker.js
          node --check scripts/test-ai-control-plane.js
      - name: AI governance regressions
        run: node scripts/test-ai-control-plane.js
      - name: Maximum security repository gate
        run: node scripts/security-max-gate.js
