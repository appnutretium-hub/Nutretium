name: Netlify Preview Performance Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - name: Allow deploy preview to settle
        run: sleep 45
      - name: Verify preview responds
        shell: bash
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--nutretium.netlify.app
        run: curl --connect-timeout 5 --max-time 15 --retry 3 --retry-delay 5 --fail --silent --show-error "$PREVIEW_URL/" >/dev/null
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe deployed preview
        env:
          E2E_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--nutretium.netlify.app
        run: node scripts/performance-probe.js
