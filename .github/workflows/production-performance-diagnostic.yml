name: Production Performance Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-performance-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - name: Verify production is publicly reachable
        run: curl --connect-timeout 5 --max-time 15 --fail --silent --show-error https://nutretium.com/ >/dev/null
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe production under mobile throttling
        env:
          E2E_BASE_URL: https://nutretium.com
        run: node scripts/performance-probe.js
