<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Enterprise Control — Nutretium</title><style>:root{--g:#d4af37;--bg:#080808;--c:#111;--l:#292929;--t:#f4f1e9;--m:#928d83;--ok:#68c98d;--bad:#e27b7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}.shell{max-width:1440px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.brand{font-weight:950;font-size:1.35rem}.brand b{color:var(--g)}.muted{color:var(--m)}.layout{display:grid;grid-template-columns:260px 1fr;gap:14px}.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px}.domains{display:grid;gap:5px;max-height:75vh;overflow:auto}.domains button,.btn{border:1px solid var(--l);background:#121212;color:var(--t);border-radius:9px;padding:9px 11px;text-align:left;cursor:pointer}.domains button.active,.btn.primary{background:var(--g);border-color:var(--g);color:#080808}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric strong{font-size:1.5rem;display:block}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:14px 0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #242424;text-align:left;vertical-align:top;white-space:nowrap}.table th{font-size:.65rem;color:var(--m);text-transform:uppercase}.status{color:var(--g)}dialog{width:min(720px,calc(100% - 24px));border:1px solid #343434;border-radius:16px;background:#101010;color:var(--t);padding:0}dialog::backdrop{background:#000b}.dlg{padding:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field input,.field select,.field textarea{background:#080808;color:#fff;border:1px solid #333;border-radius:8px;padding:9px}.field textarea{min-height:90px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.login{max-width:390px;margin:12vh auto}.error{color:var(--bad)}@media(max-width:850px){.layout{grid-template-columns:1fr}.domains{grid-template-columns:repeat(2,1fr);max-height:none}.metrics{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}}</style></head><body><section id="login" class="card login" hidden><h2>Enterprise Control</h2><p class="muted">Acceso de personal autorizado. Si tu cuenta tiene MFA, introduce el código de 6 dígitos.</p><form id="loginForm"><div class="field"><label>Correo</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><div class="field"><label>Código MFA</label><input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div><p id="loginError" class="error"></p><button class="btn primary">Entrar</button></form></section><main id="app" class="shell" hidden><div class="head"><div><div class="brand">NUTRETIUM <b>ENTERPRISE</b></div><div id="role" class="muted"></div></div><div><a class="btn" href="/ops">Command Center</a> <a class="btn" href="/admin.html">Catálogo</a> <button id="refresh" class="btn primary">Actualizar</button></div></div><div id="metrics" class="metrics"></div><div class="layout" style="margin-top:14px"><aside class="card"><strong>Módulos</strong><div id="domains" class="domains" style="margin-top:10px"></div></aside><section class="card"><div class="toolbar"><div><h2 id="domainTitle" style="margin:0">Plataforma</h2><span id="domainMeta" class="muted"></span></div><button id="newRecord" class="btn primary">Nuevo registro</button></div><div class="tablewrap"><table class="table"><thead><tr><th>ID</th><th>Nombre / referencia</th><th>Estado</th><th>Actualizado</th><th></th></tr></thead><tbody id="records"></tbody></table></div></section></div></main><dialog id="editor"><form id="editorForm" class="dlg"><h2 id="editorTitle">Registro</h2><div id="fields" class="fields"></div><details style="margin-top:12px"><summary>Campos avanzados (JSON)</summary><div class="field" style="margin-top:8px"><textarea id="advanced"></textarea></div></details><p id="editorError" class="error"></p><div class="actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary">Guardar</button></div></form></dialog><script src="/enterprise.js"></script></body></html>
