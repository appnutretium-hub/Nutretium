[build]
  publish = "."
  functions = "netlify/functions"
  command = """
    npm run build:css &&
    cat human-touch.css >> styles.css &&
    cat commerce-core.css >> styles.css &&
    cat franchise-trust.js >> app.js &&
    cat commerce-core.js >> app.js &&
    cat enterprise-storefront.js >> app.js &&
    rm -rf \
      'Listado de stock disponible.pdf' \
      'CATALOGO_NUTRETIUM.xlsx' \
      'AUDITORIA_CATALOGO.md' \
      'DESPLIEGUE.md' \
      'PRUEBAS_REDSYS.md' \
      'TODO.md' \
      'CLAUDE.md' \
      'GUIA_ARQUITECTURA_NETLIFY.md' \
      'PROMPT_SISTEMA_CLAUDE.md.md' \
      '.env.example' \
      'test_write.txt' \
      'Nuevo Documento de texto.txt' \
      '_backup_pre_actualizacion' \
      'scripts' \
      '.vscode' \
      '.claude' \
      'commerce-core.css' \
      'commerce-core.js' \
      'enterprise-storefront.js' \
      'sources/01_PNG_MAX_CALIDAD_CON_PVP' \
      'sources/00_CONTROL_CALIDAD.csv' \
      'sources/00_RELACION_IMAGENES_PVP.csv' \
      'sources/LEEME.txt' \
      'sources/PROTEINA 100% WHEY.png' \
      'sources/PROTEINA ISO WHEY.png' \
      'sources/productos/LEEME.md' \
      'sources/productos/NOMBRES_ESPERADOS.csv' \
      'sources/productos/FOTOS_PENDIENTES.md' \
      'sources/_nuevas' \
      'sources/_stock' \
      'sources/_catalogo' \
      'sources/amix_fotos_categoria_nombre_pvp_FINAL_WEB' \
      'src' \
      'tailwind.config.js'
  """

[build.environment]
  NPM_FLAGS = "--omit=optional"
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAILS"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**", "products-data.js"]

[functions."platform-backup"]
  schedule = "@daily"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https:; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://sis.redsys.es https://sis-t.redsys.es https://sis-t.redsys.es:25443"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/ops.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/ops"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/enterprise.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/enterprise"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/cuenta.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/mi-cuenta"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/sources/productos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true
[[redirects]]
  from = "/merchant-feed.xml"
  to = "/.netlify/functions/merchant-feed"
  status = 200
  force = true
[[redirects]]
  from = "/ops"
  to = "/ops.html"
  status = 200
[[redirects]]
  from = "/enterprise"
  to = "/enterprise.html"
  status = 200
[[redirects]]
  from = "/mi-cuenta"
  to = "/cuenta.html"
  status = 200
[[redirects]]
  from = "/categoria/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/producto/*"
  to = "/producto.html"
  status = 200
[[redirects]]
  from = "/pago-ok"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/pago-ko"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/*.pdf"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/*.xlsx"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/*.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/sources/_*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/_backup_pre_actualizacion/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/package*.json"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/.env*"
  to = "/index.html"
  status = 404
  force = true
