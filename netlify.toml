[build]
  publish = "dist"
  functions = "netlify/functions"
  command = """
    npm run build:css &&
    node scripts/staff-login-inject.js &&
    cat human-touch.css >> styles.css &&
    cat commerce-core.css >> styles.css &&
    node scripts/compose-app.js &&
    node --check app.js &&
    node --check trust-fixes.js &&
    node --check commerce-pro.js &&
    node --check final-hardening.js &&
    node --check commerce-suite.js &&
    node --check commercial-finish.js &&
    node --check compare-suite.js &&
    node --check pro-qa-fixes.js &&
    node --check production-finish.js &&
    node --check mobile-commerce-pro.js &&
    node --check product-variants.js &&
    node --check producto.js &&
    node --check product-education.js &&
    node --check comparar.js &&
    node --check checkout.js &&
    node --check cuenta.js &&
    node --check smart-shop.js &&
    node --check admin-shell.js &&
    node --check staff-login-ui.js &&
    node --check settings.js &&
    node --check control.js &&
    node --check backoffice.js &&
    node --check ops.js &&
    node --check enterprise.js &&
    node --check netlify/lib/email.js &&
    node --check netlify/lib/promotions.js &&
    node --check netlify/lib/staff.js &&
    node --check netlify/lib/session.js &&
    node --check netlify/lib/enterprise-store.js &&
    node --check netlify/lib/outbox.js &&
    node --check netlify/functions/auth.js &&
    node --check netlify/functions/outbox-worker.js &&
    node --check netlify/functions/redsys-notify.js &&
    node --check netlify/functions/checkout.js &&
    node --check netlify/functions/commerce.js &&
    node --check netlify/functions/saved-cart.js &&
    node --check netlify/functions/analytics-event.js &&
    node --check netlify/functions/admin-analytics.js &&
    node --check netlify/functions/system-health.js &&
    node --check netlify/functions/production-sentinel.js &&
    node --check netlify/functions/admin-orders.js &&
    node --check netlify/functions/contact.js &&
    node scripts/smoke-web.js &&
    node scripts/audit-architecture.js &&
    node scripts/prepare-dist.js
  """

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--omit=optional"
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAILS"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**", "netlify/lib/**", "products-data.js"]

[functions."platform-backup"]
  schedule = "@daily"
[functions."production-sentinel"]
  schedule = "*/30 * * * *"
[functions."automation-worker"]
  schedule = "0 7 * * *"
[functions."notification-worker"]
  schedule = "*/30 * * * *"
[functions."outbox-worker"]
  # Los emails de pedido normales los envía redsys-notify de forma síncrona;
  # aquí solo quedan el checkout enterprise y los reintentos de webhooks.
  schedule = "*/15 * * * *"
[functions."price-snapshot"]
  schedule = "15 2 * * *"
[functions."subscription-worker"]
  schedule = "30 6 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Origin-Agent-Cluster = "?1"
    Content-Security-Policy = "default-src 'self'; object-src 'none'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https:; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://sis.redsys.es https://sis-t.redsys.es https://sis-t.redsys.es:25443; worker-src 'self'; manifest-src 'self'"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/backoffice*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/control*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/checkout*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
    Cache-Control = "no-store"
[[headers]]
  for = "/comparar*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
    Cache-Control = "no-store"
[[headers]]
  for = "/ops.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/ops"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/enterprise.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/enterprise"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/cuenta.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/mi-cuenta"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
[[headers]]
  for = "/sources/productos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true
[[redirects]]
  from = "/merchant-feed.xml"
  to = "/.netlify/functions/merchant-feed"
  status = 200
  force = true
[[redirects]]
  from = "/ops"
  to = "/ops.html"
  status = 200
[[redirects]]
  from = "/enterprise"
  to = "/enterprise.html"
  status = 200
[[redirects]]
  from = "/mi-cuenta"
  to = "/cuenta.html"
  status = 200
[[redirects]]
  from = "/mi-nutretium"
  to = "/cuenta.html"
  status = 200
[[redirects]]
  from = "/ayuda"
  to = "/ayuda.html"
  status = 200
[[redirects]]
  from = "/aprende"
  to = "/aprende.html"
  status = 200
[[redirects]]
  from = "/privacidad"
  to = "/privacidad.html"
