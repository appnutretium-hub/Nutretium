<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mi cuenta — Nutretium</title><style>:root{--g:#d4af37;--bg:#080808;--c:#111;--l:#292929;--t:#f3efe7;--m:#948e84}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 Inter,system-ui,sans-serif}.shell{max-width:1050px;margin:auto;padding:25px 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:950;font-size:1.3rem}.brand b{color:var(--g)}a,button{color:inherit}.btn{border:1px solid var(--l);background:#121212;border-radius:9px;padding:9px 12px;text-decoration:none;cursor:pointer}.primary{background:var(--g);border-color:var(--g);color:#080808}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.card{border:1px solid var(--l);background:var(--c);border-radius:14px;padding:15px}.card h2{font-size:1rem;margin:0 0 9px}.muted{color:var(--m)}.list{display:grid;gap:7px}.item{border:1px solid #262626;border-radius:9px;padding:9px}.forms{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}input,textarea,select{width:100%;background:#080808;border:1px solid #333;color:#fff;border-radius:8px;padding:9px;margin:4px 0 8px}textarea{min-height:75px}.full{grid-column:1/-1}.login{max-width:380px;margin:15vh auto}@media(max-width:800px){.grid,.forms{grid-template-columns:1fr}}</style></head><body><section id="login" class="card login" hidden><h2>Mi cuenta</h2><p class="muted">Inicia sesión para acceder a tus servicios.</p><a class="btn primary" href="/?login=1">Volver a la tienda</a></section><main id="app" class="shell" hidden><div class="head"><div class="brand">NUTRETIUM <b>MI CUENTA</b></div><a class="btn" href="/">Volver a comprar</a></div><div class="grid"><section class="card"><h2>Fidelización</h2><div id="loyalty"></div></section><section class="card"><h2>Suscripciones</h2><div id="subscriptions" class="list"></div></section><section class="card"><h2>Devoluciones</h2><div id="returns" class="list"></div></section><section class="card"><h2>Soporte</h2><div id="tickets" class="list"></div></section><section class="card"><h2>Carritos guardados</h2><div id="carts" class="list"></div></section><section class="card"><h2>Privacidad</h2><div id="privacy" class="list"></div></section></div><div class="forms"><form id="supportForm" class="card"><h2>Contactar soporte</h2><input id="subject" placeholder="Asunto" required><textarea id="message" placeholder="Mensaje" required></textarea><button class="btn primary">Enviar</button></form><form id="privacyForm" class="card"><h2>Derechos de privacidad</h2><select id="privacyType"><option value="access">Acceso</option><option value="rectification">Rectificación</option><option value="erasure">Supresión</option><option value="restriction">Limitación</option><option value="portability">Portabilidad</option><option value="objection">Oposición</option></select><textarea id="privacyDetails" placeholder="Detalles"></textarea><button class="btn primary">Solicitar</button></form><form id="passwordForm" class="card full"><h2>Seguridad</h2><div class="forms" style="margin:0"><div><input id="oldPassword" type="password" placeholder="Contraseña actual" required></div><div><input id="newPassword" type="password" placeholder="Nueva contraseña (mín. 10)" required></div></div><button class="btn primary">Cambiar contraseña</button><span id="securityMsg" class="muted"></span></form></div></main><script src="/cuenta.js"></script></body></html>
