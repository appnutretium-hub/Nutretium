name: HTML Production Compliance

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/repair-index-html.js'
      - 'scripts/prepare-dist.js'
      - '.github/workflows/html-production-repair.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/repair-index-html.js'
      - 'scripts/prepare-dist.js'
      - '.github/workflows/html-production-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html-production-compliance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-html:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply deterministic repair in ephemeral checkout
        env:
          NUTRETIUM_HTML_REPAIR_MODE: write
        run: node scripts/repair-index-html.js

      - name: Verify repair is idempotent
        env:
          NUTRETIUM_HTML_REPAIR_MODE: check
        run: node scripts/repair-index-html.js

      - name: Static accessibility audit
        run: node scripts/accessibility-static-audit.js

      - name: Storefront smoke test
        run: node scripts/smoke-web.js

      - name: JavaScript release check
        run: node scripts/check-release-js.js

      - name: Verify generated repair diff is syntactically clean
        run: |
          git diff --check
          git diff -- index.html
