<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Mi Nutretium</title><link rel="stylesheet" href="/styles.css"><style>body{margin:0;background:#090909;color:#f5f2e9;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid #28220d}.brand{color:#d4af37;font-weight:900;text-decoration:none;font-size:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}.card{background:#111;border:1px solid #262626;border-radius:16px;padding:18px}.card b{display:block;font-size:28px;color:#d4af37}.section{margin:30px 0}.section h2{font-size:22px}.list{display:grid;gap:10px}.row{background:#101010;border:1px solid #252525;border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:14px;align-items:center}.btn{background:#d4af37;color:#070707;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}.muted{color:#969087;font-size:13px}.empty{padding:22px;border:1px dashed #373737;border-radius:14px;color:#8e8980}.login{max-width:460px;margin:80px auto}.login input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;background:#111;border:1px solid #333;border-radius:10px;color:white}@media(max-width:780px){.grid{grid-template-columns:1fr 1fr}.row{align-items:flex-start;flex-direction:column}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a href="/" class="brand">NUTRETIUM</a><div><a href="/smart-shop.html" class="btn">Recomendador</a></div></div><section id="loginBox" class="login" hidden><h1>Mi Nutretium</h1><p class="muted">Inicia sesión para ver pedidos, recompra, puntos y carrito guardado.</p><input id="email" type="email" placeholder="Email"><input id="password"
