name: Candidate Performance Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: candidate-performance-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--nutretium.netlify.app
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --omit=optional
      - name: Wait for exact Netlify Deploy Preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if body="$(curl --connect-timeout 5 --max-time 15 --fail --silent --show-error "$PREVIEW_URL/build-meta.json" 2>/dev/null)"; then
              ref="$(printf '%s' "$body" | node -e "let s='';process.stdin.setEncoding('utf8');process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{process.stdout.write(String(JSON.parse(s).commitRef||''))}catch(_){process.exit(2)}})")" || ref=""
              if [ "$ref" = "$EXPECTED_SHA" ]; then
                echo "[candidate-performance] Deploy Preview exacto disponible para $EXPECTED_SHA"
                exit 0
              fi
              echo "[candidate-performance] preview aún no corresponde al SHA esperado (actual: ${ref:-sin-meta})"
            else
              echo "[candidate-performance] preview todavía no disponible"
            fi
            sleep 4
          done
          echo "[candidate-performance] FAIL: Netlify no expuso el Deploy Preview del SHA exacto $EXPECTED_SHA"
          exit 1
      - name: Verify preview is publicly reachable
        run: curl --connect-timeout 5 --max-time 15 --fail --silent --show-error "$PREVIEW_URL/" >/dev/null
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe exact candidate under mobile throttling
        env:
          E2E_BASE_URL: ${{ env.PREVIEW_URL }}
        run: node scripts/performance-probe.js
