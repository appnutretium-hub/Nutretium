name: Nutretium Preproduction Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preproduction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - name: Build production-equivalent assets
        run: npm run build:css
      - name: Supply-chain and contracts
        run: |
          node scripts/audit-supply-chain.js
          node scripts/audit-api-contracts.js
          # Netlify and CI install with --omit=optional; audit that exact production set.
          npm audit --omit=dev --omit=optional --audit-level=high
      - name: Static quality budgets
        run: |
          node scripts/performance-budget.js
          node scripts/accessibility-static-audit.js
      - name: Syntax and enterprise tests
        run: npm run test:enterprise
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local preproduction
        run: |
          node scripts/dev-server.js > /tmp/nutretium-preprod.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/nutretium-preprod.log; exit 1
      - name: Browser quality suite
        run: npx playwright test tests/e2e-storefront.spec.js tests/e2e-quality.spec.js --browser=chromium --workers=1
      - name: Optional remote staging smoke
        if: ${{ env.STAGING_BASE_URL != '' }}
        run: |
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$STAGING_BASE_URL/" >/tmp/staging-home
          grep -qi 'Nutretium' /tmp/staging-home
          curl --fail --silent --show-error --location "$STAGING_BASE_URL/.netlify/functions/site-status" >/tmp/staging-status
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/staging-status','utf8'));
          if(typeof s.maintenance!=='boolean') throw new Error('site-status remoto no tiene el contrato esperado');
          NODE
