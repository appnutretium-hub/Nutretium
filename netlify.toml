[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--omit=optional"
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAILS"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**", "netlify/lib/**", "products-data.js"]

[functions."platform-backup"]
  schedule = "@daily"
[functions."production-sentinel"]
  schedule = "*/30 * * * *"
[functions."automation-worker"]
  schedule = "0 7 * * *"
[functions."ai-worker"]
  schedule = "30 5 * * *"
[functions."workforce-worker"]
  schedule = "0 * * * *"
[functions."notification-worker"]
  schedule = "*/30 * * * *"
[functions."outbox-worker"]
  # Los emails de pedido normales los envía redsys-notify de forma síncrona;
  # aquí solo quedan el checkout enterprise y los reintentos de webhooks.
  schedule = "*/15 * * * *"
[functions."price-snapshot"]
  schedule = "15 2 * * *"
[functions."subscription-worker"]
  schedule = "30 6 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"
    X-Permitted-Cross-Domain-Policies = "none"
    Origin-Agent-Cluster = "?1"
    Content-Security-Policy = "default-src 'self'; object-src 'none'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https:; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://sis.redsys.es https://sis-t.redsys.es https://sis-t.redsys.es:25443; worker-src 'self'; manifest-src 'self'; report-uri /.netlify/functions/csp-report"

