<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nutretium — Preview Human Touch</title>
  <style>
    html,body{margin:0;height:100%;background:#090909;color:#fff;font-family:Inter,Arial,sans-serif}
    .bar{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0d0d0d;border-bottom:1px solid rgba(212,175,55,.2);box-sizing:border-box;position:fixed;top:0;left:0;right:0;z-index:10}
    .bar strong{font-size:13px;letter-spacing:.04em}.bar span{font-size:12px;color:#aaa}.bar a{color:#d4af37;text-decoration:none;font-size:12px;font-weight:700}
    iframe{position:fixed;top:46px;left:0;width:100%;height:calc(100% - 46px);border:0;background:#0a0a0a}
  </style>
</head>
<body>
  <div class="bar">
    <div><strong>NUTRETIUM · HUMAN TOUCH</strong> <span>— web original + mejora visual</span></div>
    <a href="index.html" target="_blank">Abrir original</a>
  </div>
  <iframe id="site" src="index.html" title="Preview Nutretium"></iframe>
  <script>
    const frame=document.getElementById('site');
    frame.addEventListener('load',()=>{
      try{
        const d=frame.contentDocument;
        if(!d || d.querySelector('link[data-human-touch]')) return;
        const link=d.createElement('link');
        link.rel='stylesheet';
        link.href='human-touch.css';
        link.dataset.humanTouch='1';
        d.head.appendChild(link);
      }catch(e){console.warn('No se pudo inyectar la capa de preview',e)}
    });
  </script>
</body>
</html>
