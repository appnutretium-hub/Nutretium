name: Temporary Lockfile Sync
on:
  push:
    branches: [hotfix/final-structure-cleanup-20260920]
    paths: ['.github/workflows/lockfile-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify lockfile Node requirement
        run: node -e "const p=require('./package-lock.json'); if(p.packages?.['']?.engines?.node!=='>=22') process.exit(1)"
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Sincroniza package-lock con Node 22'
          git push origin HEAD:hotfix/final-structure-cleanup-20260920
