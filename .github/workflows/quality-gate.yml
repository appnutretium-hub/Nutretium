name: Nutretium Full Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: full-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - name: Build production-equivalent storefront
        run: |
          npm run build:css
          node scripts/staff-login-inject.js
          node scripts/compose-app.js
          node --check app.js
      - name: Core and enterprise tests
        run: |
          npm test
          NUTRETIUM_TEST_MEMORY_BLOBS=true npm run test:redsys
          npm run test:catalogo
          npm run test:pim
          npm run test:customer
          npm run test:security
          npm run test:admin-security
          node scripts/test-staff-access-recovery.js
          node scripts/test-zero-trust-security.js
          npm run test:admin
          npm run test:cuentas
          npm run test:passwords
          npm run test:contracts
          npm run test:external-readiness
          npm run test:production-quality
          npm run test:enterprise
      - name: AI, Nexus, workforce, federation and zero-cost regressions
        run: |
          node scripts/test-ai-control-plane.js
          node scripts/test-nexus-core.js
          node scripts/test-enterprise-workforce.js
          node scripts/test-enterprise-workforce-runtime.js
          node scripts/test-zero-cost-policy.js
          node scripts/test-ai-federation.js
          node scripts/test-ai-growth-loop.js
          node scripts/test-agent-safe-memory.js
          node scripts/test-agent-memory-extreme.js
      - name: Syntax hardening
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './dist/*' -print0 | xargs -0 -n1 node --check
      - name: Repository-wide programming integrity
        run: node scripts/audit-complete-programming.js
      - name: Interactive controls certification must be complete
        run: node scripts/audit-interactive-controls.js
      - name: Architecture and maximum security audits
        run: |
          node scripts/audit-architecture.js
          node scripts/security-audit.js
          node scripts/security-max-gate.js
          node scripts/audit-workflow-pinning.js
      - name: Build final HTML trust audit
        run: |
          node scripts/trust-inject.js
          node scripts/build-seo-pages.js
          node scripts/build-trust-audit.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start and verify static storefront
        run: |
          node scripts/dev-server.js > /tmp/nutretium-server.log 2>&1 &
          echo $! > /tmp/nutretium-server.pid
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nutretium-server.log
          exit 1
      - name: Browser E2E
        run: npx playwright test tests/e2e-storefront.spec.js tests/e2e-quality.spec.js tests/e2e-critical-flows.spec.js tests/e2e-interactive-controls.spec.js --browser=chromium --workers=1
      - name: Exhaustive 223-control browser certification
        run: npx playwright test tests/e2e-all-controls.spec.js --browser=chromium --workers=1
