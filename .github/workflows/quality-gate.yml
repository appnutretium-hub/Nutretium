name: Nutretium Quality Gate
on:
  push:
    branches: [main, 'feature/**', 'hotfix/**', 'final-**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - name: Build CSS
        run: npm run build:css
      - name: Core tests
        run: |
          npm test
          npm run test:redsys
          npm run test:catalogo
          npm run test:admin
          npm run test:cuentas
      - name: Syntax hardening
        run: |
          node --check runtime-content.js
          node --check runtime-performance.js
          node --check runtime-guard.js
          node --check cuenta.js
          node --check pedido.js
          node --check settings.js
          node --check netlify/lib/rate-limit.js
          node --check netlify/lib/guest-access.js
          node --check netlify/lib/settings.js
          node --check netlify/functions/account-security.js
          node --check netlify/functions/guest-order.js
          node --check netlify/functions/client-error.js
          node --check netlify/functions/site-status.js
          node --check netlify/functions/site-config.js
          node --check netlify/functions/admin-settings.js
          node --check netlify/functions/checkout.js
          node --check netlify/functions/system-health.js
      - name: Architecture and security audits
        run: |
          node scripts/audit-architecture.js
          node scripts/security-audit.js
      - name: Build final HTML trust audit
        run: |
          node scripts/trust-inject.js
          node scripts/build-trust-audit.js
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static storefront
        run: node scripts/dev-server.js > /tmp/nutretium-server.log 2>&1 &
      - name: Browser E2E
        run: npx playwright test tests/e2e-storefront.spec.js --browser=chromium --workers=1
