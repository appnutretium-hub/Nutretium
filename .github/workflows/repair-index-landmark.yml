name: Temporary main landmark repair
on:
  push:
    branches: ['feat/nutretium-nexus-40']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/nutretium-nexus-40
      - name: Insert semantic main landmark once
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          if(!/<main\b/i.test(html)){
            const navEnd='  </nav>\n';
            const footerMarker='  <!-- ══════════════════════════════════════════\n       FOOTER';
            if(!html.includes(navEnd))throw new Error('No se encontró el cierre del nav.');
            if(!html.includes(footerMarker))throw new Error('No se encontró el inicio del footer.');
            html=html.replace(navEnd,navEnd+'\n  <main id="main-content">\n');
            html=html.replace(footerMarker,'  </main>\n\n'+footerMarker);
            fs.writeFileSync(file,html,'utf8');
          }
          NODE
      - name: Commit repair if needed
        run: |
          if git diff --quiet -- index.html; then
            echo "No repair needed"
            exit 0
          fi
          git config user.name "nutretium-ci"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix(a11y): add main landmark to storefront"
          git push origin HEAD:feat/nutretium-nexus-40
