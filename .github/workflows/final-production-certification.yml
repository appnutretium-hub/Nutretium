name: Nutretium Final Production Certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-production-certification
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality-gate.yml

  certify-production:
    name: Certify exact production release
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ORDER_EMAIL_FROM: ${{ secrets.ORDER_EMAIL_FROM }}
      TPVSOL_SYNC_MODE: ${{ secrets.TPVSOL_SYNC_MODE }}
      TPVSOL_SYNC_ENDPOINT: ${{ secrets.TPVSOL_SYNC_ENDPOINT }}
      TPVSOL_SYNC_TOKEN: ${{ secrets.TPVSOL_SYNC_TOKEN }}
      TPVSOL_CONNECTION_VALIDATED: ${{ secrets.TPVSOL_CONNECTION_VALIDATED }}
    steps:
      - name: Require certification from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "La certificación final solo puede ejecutarse sobre main." >&2
            exit 1
          fi
          echo "[certification] SHA objetivo: $GITHUB_SHA"

      - name: Require external certification credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$NETLIFY_SITE_ID" ]] || missing+=(NETLIFY_SITE_ID)
          [[ -n "$NETLIFY_API_TOKEN" ]] || missing+=(NETLIFY_API_TOKEN)
          [[ -n "$RESEND_API_KEY" ]] || missing+=(RESEND_API_KEY)
          [[ -n "$ORDER_EMAIL_FROM" ]] || missing+=(ORDER_EMAIL_FROM)
          [[ -n "$TPVSOL_SYNC_MODE" ]] || missing+=(TPVSOL_SYNC_MODE)
          [[ -n "$TPVSOL_SYNC_ENDPOINT" ]] || missing+=(TPVSOL_SYNC_ENDPOINT)
          [[ -n "$TPVSOL_SYNC_TOKEN" ]] || missing+=(TPVSOL_SYNC_TOKEN)
          [[ -n "$TPVSOL_CONNECTION_VALIDATED" ]] || missing+=(TPVSOL_CONNECTION_VALIDATED)
          if (( ${#missing[@]} > 0 )); then
            printf 'NO VALIDADO: faltan secretos de certificación: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Wait for exact Netlify production deploy
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          matched=false
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $NETLIFY_API_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" > /tmp/netlify-site.json
            published="$(node - <<'NODE'
          const fs=require('fs');
          const site=JSON.parse(fs.readFileSync('/tmp/netlify-site.json','utf8'));
          const d=site.published_deploy||{};
          process.stdout.write(String(d.commit_ref||d.commit||''));
          NODE
          )"
            if [[ "$published" == "$expected" ]]; then
              echo "[certification] Netlify publica exactamente $expected"
              matched=true
              break
            fi
            echo "[certification] esperando despliegue exacto (publicado=${published:-desconocido}) intento $attempt/30"
            sleep 10
          done
          if [[ "$matched" != true ]]; then
            echo "NO VALIDADO: Netlify no está sirviendo el SHA exacto $expected." >&2
            exit 1
          fi

      - name: Verify public storefront and security headers
        shell: bash
        run: |
          set -euo pipefail
          base="https://nutretium.com"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 -D /tmp/headers -o /tmp/home "$base/"
          grep -qi '^x-frame-options: *DENY' /tmp/headers
          grep -qi '^x-content-type-options: *nosniff' /tmp/headers
          grep -qi '^strict-transport-security:' /tmp/headers
          grep -qi '^content-security-policy:' /tmp/headers
          grep -qi '^cross-origin-resource-policy: *same-site' /tmp/headers
          grep -qi 'Nutretium' /tmp/home
          curl --fail --silent --show-error --location "$base/.well-known/security.txt" >/tmp/security-txt
          grep -qi '^Contact: mailto:' /tmp/security-txt
          grep -qi '^Canonical: https://nutretium.com/.well-known/security.txt' /tmp/security-txt

      - name: Require real commerce readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://nutretium.com/.netlify/functions/site-status" > /tmp/site-status.json
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/site-status.json','utf8'));
          const failures=[];
          if(s.maintenance!==false) failures.push('maintenance debe ser false');
          if(s.storefrontReady!==true) failures.push('storefrontReady debe ser true');
          if(s.shippingReady!==true) failures.push('shippingReady debe ser true');
          if(s.commerceReady!==true) failures.push('commerceReady debe ser true');
          if(s.payment?.environment!=='production') failures.push('Redsys debe estar en production');
          if(s.payment?.commerceLive!==true) failures.push('COMMERCE_LIVE debe ser true');
          if(s.payment?.credentialsConfigured!==true) failures.push('credenciales de pago no validadas');
          if(failures.length){
            console.error('NO VALIDADO:',failures.join(' | '));
            process.exit(1);
          }
          console.log('[certification] storefront + shipping + pago real preparados');
          NODE

      - name: Verify Resend sender domain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            "https://api.resend.com/domains" > /tmp/resend-domains.json
          node - <<'NODE'
          const fs=require('fs');
          const sender=String(process.env.ORDER_EMAIL_FROM||'');
          const match=sender.match(/@([^>\s]+)>?$/);
          const domain=(match?.[1]||'').toLowerCase();
          if(!domain){console.error('NO VALIDADO: ORDER_EMAIL_FROM no contiene un dominio válido.');process.exit(1)}
          const body=JSON.parse(fs.readFileSync('/tmp/resend-domains.json','utf8'));
          const domains=Array.isArray(body.data)?body.data:[];
          const record=domains.find(x=>String(x?.name||'').toLowerCase()===domain);
          if(!record || String(record.status||'').toLowerCase()!=='verified'){
            console.error(`NO VALIDADO: dominio Resend ${domain} no figura como verified.`);
            process.exit(1);
          }
          console.log(`[certification] Resend ${domain}: verified`);
          NODE

      - name: Require validated TPVsol channel
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const mode=String(process.env.TPVSOL_SYNC_MODE||'').toLowerCase();
          const endpoint=String(process.env.TPVSOL_SYNC_ENDPOINT||'');
          const token=String(process.env.TPVSOL_SYNC_TOKEN||'');
          const validated=String(process.env.TPVSOL_CONNECTION_VALIDATED||'').toLowerCase()==='true';
          const failures=[];
          if(!['api','middleware'].includes(mode)) failures.push('TPVSOL_SYNC_MODE debe ser api o middleware');
          if(!/^https:\/\//i.test(endpoint)) failures.push('TPVSOL_SYNC_ENDPOINT debe ser HTTPS');
          if(!token) failures.push('TPVSOL_SYNC_TOKEN ausente');
          if(!validated) failures.push('TPVSOL_CONNECTION_VALIDATED debe ser true');
          if(failures.length){console.error('NO VALIDADO:',failures.join(' | '));process.exit(1)}
          console.log('[certification] canal TPVsol declarado y validado');
          NODE

      - name: Publish certification summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Nutretium Production Certification'
            echo
            echo "- SHA certificado: \`$GITHUB_SHA\`"
            echo '- Full Quality Gate: PASS'
            echo '- Netlify exact SHA: PASS'
            echo '- Storefront/security smoke: PASS'
            echo '- Commerce live + shipping + payment: PASS'
            echo '- Resend domain: PASS'
            echo '- TPVsol declared channel: PASS'
            echo
            echo '## Resultado'
            echo '**PRODUCTION CERTIFIED — controles automáticos cerrados en verde.**'
            echo
            echo '> La autorización bancaria humana de una compra real 3-D Secure y cualquier evidencia física/regulatoria no digital siguen requiriendo su evidencia correspondiente; este workflow no las falsifica ni las sustituye.'
          } >> "$GITHUB_STEP_SUMMARY"
