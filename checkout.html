<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Finalizar compra | Nutretium</title><link rel="stylesheet" href="/styles.css"><style>body{margin:0;background:#090909;color:#f4f0e7;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1060px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #262626;padding:16px 0}.brand{font-size:22px;font-weight:900;color:#d4af37;text-decoration:none}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;margin-top:30px}.card{background:#111;border:1px solid #282828;border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input{background:#090909;color:#fff;border:1px solid #353535;border-radius:10px;padding:12px}.btn{width:100%;border:0;border-radius:11px;padding:14px;background:#d4af37;color:#050505;font-weight:900;cursor:pointer}.muted{color:#969087;font-size:13px}.line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #242424}.total{font-size:20px;font-weight:900;color:#d4af37}.coupon{display:flex;gap:8px;margin:15px 0}.coupon input{flex:1;background:#090909;color:#fff;border:1px solid #353535;border-radius:10px;padding:10px}.hidden{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><main class="wrap"><div class="top"><a class="brand" href="/">NUTRETIUM</a><span class="muted">Pago seguro mediante Redsys</span></div><div class="layout"><section class="card"><h1>Finalizar compra</h1><p id="modeText" class="muted"></p><div id="guestFields" class="grid"><div class="field"><label>Nombre</label><input id="name"></div><div class="field"><label>Apellidos</label><input id="surname"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Teléfono</label><input id="phone" type="tel"></div><div class="field full"><label>Calle y número</label><input id="calle"></div><div class="field"><label>Piso / puerta</label><input id="piso"></div><div class="field"><label>Código postal</label><input id="cp" inputmode="numeric"></div><div class="field"><label>Localidad</label><input id="localidad"></div><div class="field"><label>Provincia</label><input id="provincia"></div><div class="field full"><label>País</label><input id="pais" value="España"></div></div><p id="error" class="muted"></p><button id="pay" class="btn">Continuar a pago seguro</button></section><aside class="card"><h2>Tu pedido</h2><div id="lines"></div><div class="coupon"><input id="coupon" placeholder="Código promocional"><button id="applyCoupon" class="btn" style="width:auto;padding:10px 12px">Aplicar</button></div><p id="couponMsg" class="muted"></p><div class="line"><span>Subtotal</span><span id="subtotal">—</span></div><div id="discountRow" class="line hidden"><span>Descuento</span><span id="discount">—</span></div><div class="line total"><span>Total</span><span id="total">—</span></div></aside></div></main><script src="/products-data.js"></script><script src="/checkout.js"></script></body></html>
