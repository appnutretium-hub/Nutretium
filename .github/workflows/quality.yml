name: Nutretium Build & Enterprise Gate
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'hotfix/**', 'hardening/**', 'security/**', 'final-**']
  pull_request:
    branches: [main]
concurrency:
  group: quality-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --omit=optional
      - name: Build storefront
        run: npm run build:css
      - name: Price and cart tests
        run: npm test
      - name: Redsys tests
        run: npm run test:redsys
      - name: Catalog tests
        run: npm run test:catalogo
      - name: Admin tests
        run: npm run test:admin
      - name: Account tests
        run: npm run test:cuentas
      - name: Commerce tests
        run: npm run test:commerce
      - name: Zero Trust security tests
        run: node scripts/test-zero-trust-security.js
      - name: External readiness tests
        run: npm run test:external-readiness
      - name: Enterprise platform tests
        run: npm run test:enterprise
  deploy-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --omit=optional
      - name: Reproduce Netlify build
        run: |
          npm run build:css
          node scripts/staff-login-inject.js
          cat human-touch.css >> styles.css
          cat commerce-core.css >> styles.css
          node scripts/compose-app.js
          node --check app.js
          node --check trust-fixes.js
          node --check commerce-pro.js
          node --check final-hardening.js
          node --check commerce-suite.js
          node --check commercial-finish.js
          node --check compare-suite.js
          node --check pro-qa-fixes.js
          node --check production-finish.js
          node --check mobile-commerce-pro.js
          node --check product-variants.js
          node --check producto.js
          node --check product-education.js
          node --check comparar.js
          node --check checkout.js
          node --check cuenta.js
          node --check smart-shop.js
          node --check admin-shell.js
          node --check staff-login-ui.js
          node --check settings.js
          node --check control.js
          node --check backoffice.js
          node --check ops.js
          node --check enterprise.js
          node --check staff-session-bridge.js
          node --check netlify/lib/email.js
          node --check netlify/lib/promotions.js
          node --check netlify/lib/staff.js
          node --check netlify/lib/external-readiness.js
          node --check netlify/lib/security-policy.js
          node --check netlify/lib/security-defense.js
          node --check netlify/lib/mfa-replay.js
          node --check netlify/lib/security-step-up.js
          node --check netlify/functions/admin-external-readiness.js
          node --check netlify/functions/redsys-notify.js
          node --check netlify/functions/checkout.js
          node --check netlify/functions/commerce.js
          node --check netlify/functions/saved-cart.js
          node --check netlify/functions/analytics-event.js
          node --check netlify/functions/admin-analytics.js
          node --check netlify/functions/admin-session.js
          node --check netlify/functions/admin-step-up.js
          node --check netlify/functions/admin-settings.js
          node --check netlify/functions/admin-governance.js
          node --check netlify/functions/platform-restore.js
          node --check netlify/functions/refund-redsys.js
          node --check netlify/functions/system-health.js
          node --check netlify/functions/production-sentinel.js
          node --check netlify/functions/admin-orders.js
          node --check netlify/functions/contact.js
          node --check scripts/test-defense-in-depth.js
          node scripts/test-zero-trust-security.js
          node scripts/smoke-web.js
          node scripts/audit-architecture.js
          node scripts/security-audit.js
          node scripts/audit-workflow-pinning.js
