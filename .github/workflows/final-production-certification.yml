name: Nutretium Final Production Certification

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: final-production-certification
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality-gate.yml

  certify-production:
    name: Certify exact production release
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
    steps:
      - name: Checkout exact certification revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require certification from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "La certificación final solo puede ejecutarse sobre main." >&2
            exit 1
          fi
          echo "[certification] SHA objetivo: $GITHUB_SHA"

      - name: Verify authorized production commit origin
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUTRETIUM_CERT_SHA: ${{ github.sha }}
          NUTRETIUM_CERT_REPO: ${{ github.repository }}
        run: |
          node - <<'NODE'
          const {guardProductionDeploy}=require('./scripts/verify-production-deploy-origin');
          const env={
            ...process.env,
            NETLIFY:'true',
            CONTEXT:'production',
            BRANCH:'main',
            GITHUB_BRANCH:'main',
            COMMIT_REF:process.env.NUTRETIUM_CERT_SHA,
            GITHUB_REPO:process.env.NUTRETIUM_CERT_REPO,
          };
          guardProductionDeploy({env}).then(result=>{
            if(!result?.allowed)throw new Error('El origen del commit no está autorizado para producción.');
            console.log('[certification] origen autorizado:',JSON.stringify(result));
          }).catch(error=>{
            console.error('NO VALIDADO: origen de commit no autorizado:',error.message||error);
            process.exit(1);
          });
          NODE

      - name: Require deployment certification credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$NETLIFY_SITE_ID" ]] || missing+=(NETLIFY_SITE_ID)
          [[ -n "$NETLIFY_API_TOKEN" ]] || missing+=(NETLIFY_API_TOKEN)
          if (( ${#missing[@]} > 0 )); then
            printf 'NO VALIDADO: faltan secretos raíz de despliegue: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo '[certification] las credenciales operativas de Redsys, Resend y TPVsol se validan en runtime desde la bóveda administrada; no se duplican en GitHub.'

      - name: Wait for exact Netlify production deploy
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          matched=false
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $NETLIFY_API_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" > /tmp/netlify-site.json
            published="$(node - <<'NODE'
          const fs=require('fs');
          const site=JSON.parse(fs.readFileSync('/tmp/netlify-site.json','utf8'));
          const d=site.published_deploy||{};
          process.stdout.write(String(d.commit_ref||d.commit||''));
          NODE
          )"
            if [[ "$published" == "$expected" ]]; then
              echo "[certification] Netlify publica exactamente $expected"
              matched=true
              break
            fi
            echo "[certification] esperando despliegue exacto (publicado=${published:-desconocido}) intento $attempt/30"
            sleep 10
          done
          if [[ "$matched" != true ]]; then
            echo "NO VALIDADO: Netlify no está sirviendo el SHA exacto $expected." >&2
            exit 1
          fi

      - name: Verify public storefront and security headers
        shell: bash
        run: |
          set -euo pipefail
          base="https://nutretium.com"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 -D /tmp/headers -o /tmp/home "$base/"
          grep -qi '^x-frame-options: *DENY' /tmp/headers
          grep -qi '^x-content-type-options: *nosniff' /tmp/headers
          grep -qi '^strict-transport-security:' /tmp/headers
          grep -qi '^content-security-policy:' /tmp/headers
          grep -qi '^cross-origin-resource-policy: *same-site' /tmp/headers
          grep -qi 'Nutretium' /tmp/home
          curl --fail --silent --show-error --location "$base/.well-known/security.txt" >/tmp/security-txt
          grep -qi '^Contact: mailto:' /tmp/security-txt
          grep -qi '^Canonical: https://nutretium.com/.well-known/security.txt' /tmp/security-txt

      - name: Read managed production readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://nutretium.com/.netlify/functions/site-status" > /tmp/site-status.json
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/site-status.json','utf8'));
          const failures=[];
          if(s.maintenance!==false) failures.push('maintenance debe ser false');
          if(s.storefrontReady!==true) failures.push('storefrontReady debe ser true');
          if(s.shippingReady!==true) failures.push('shippingReady debe ser true');
          if(s.commerceReady!==true) failures.push('commerceReady debe ser true');
          if(s.payment?.environment!=='production') failures.push('Redsys debe estar en production');
          if(s.payment?.commerceLive!==true) failures.push('COMMERCE_LIVE debe ser true');
          if(s.payment?.credentialsConfigured!==true) failures.push('credenciales de pago no validadas');
          if(s.integrations?.email?.ready!==true) failures.push(`Resend no validado (${s.integrations?.email?.reason||'sin estado'})`);
          if(s.integrations?.tpvsol?.ready!==true) failures.push(`TPVsol no validado (${s.integrations?.tpvsol?.reason||'sin estado'})`);
          if(failures.length){console.error('NO VALIDADO:',failures.join(' | '));process.exit(1)}
          console.log(`[certification] comercio + shipping + Redsys + Resend(${s.integrations.email.domain||'dominio'}) + TPVsol(${s.integrations.tpvsol.mode||'modo'}) preparados`);
          NODE

      - name: Publish certification summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Nutretium Production Certification'
            echo
            echo "- SHA certificado: \`$GITHUB_SHA\`"
            echo '- Commit origin autorizado: PASS'
            echo '- Full Quality Gate: PASS'
            echo '- Netlify exact SHA: PASS'
            echo '- Storefront/security smoke: PASS'
            echo '- Commerce live + shipping + payment: PASS'
            echo '- Resend gestionado/validado desde panel: PASS'
            echo '- TPVsol gestionado/validado desde panel: PASS'
            echo
            echo '## Resultado'
            echo '**PRODUCTION CERTIFIED — controles automáticos cerrados en verde.**'
            echo
            echo '> La autorización bancaria humana de una compra real 3-D Secure y cualquier evidencia física/regulatoria no digital siguen requiriendo su evidencia correspondiente; este workflow no las falsifica ni las sustituye.'
          } >> "$GITHUB_STEP_SUMMARY"
