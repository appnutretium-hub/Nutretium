name: Nutretium Maximum Security Gate
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
concurrency:
  group: security-max-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --omit=optional
      - name: Production dependency audit
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit.json || true
          cp /tmp/npm-audit.json npm-audit.json
          node scripts/report-npm-audit.js /tmp/npm-audit.json
      - name: Preserve dependency audit report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-production
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 3
      - name: Maximum security repository gate
        run: node scripts/security-max-gate.js
      - name: Security token regressions
        run: npm run test:security
      - name: Build admin security surface
        run: |
          npm run build:css
          node scripts/staff-login-inject.js
      - name: Admin security regressions
        run: npm run test:admin-security
      - name: Zero Trust regressions
        run: node scripts/test-zero-trust-security.js
      - name: Security architecture audit
        run: node scripts/security-audit.js
      - name: Immutable workflow pinning audit
        run: node scripts/audit-workflow-pinning.js
      - name: Critical syntax
        run: |
          node --check netlify/lib/totp.js
          node --check netlify/lib/mfa-replay.js
          node --check netlify/lib/security-defense.js
          node --check netlify/functions/staff-login.js
          node --check netlify/functions/admin-step-up.js
          node --check scripts/report-npm-audit.js
