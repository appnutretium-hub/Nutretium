name: Nutretium Netlify Production Revision Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/netlify-production-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read live production build metadata from both domains
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          for target in custom direct; do
            if [ "$target" = "custom" ]; then
              url="https://nutretium.com/build-meta.json?diagnostic=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            else
              url="https://nutretium.netlify.app/build-meta.json?diagnostic=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            fi
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              -D "/tmp/build-meta-headers-${target}" \
              -o "/tmp/build-meta-${target}" \
              "$url"
          done
          EXPECTED_MAIN_SHA="$EXPECTED_MAIN_SHA" node - <<'NODE'
          const fs = require('fs');
          const expected = String(process.env.EXPECTED_MAIN_SHA || '').trim();
          const read = (name) => JSON.parse(fs.readFileSync(`/tmp/build-meta-${name}`, 'utf8'));
          const custom = read('custom');
          const direct = read('direct');
          const safe = (meta) => ({
            commitRef: meta.commitRef ?? null,
            branch: meta.branch ?? null,
            context: meta.context ?? null,
            generatedAt: meta.generatedAt ?? null,
            exactMatch: Boolean(expected && meta.commitRef === expected)
          });
          console.log('[netlify-production-diagnostic]');
          console.log(JSON.stringify({
            expectedMainSha: expected || null,
            customDomain: safe(custom),
            directNetlifyDomain: safe(direct),
            sameProductionArtifact: custom.commitRef === direct.commitRef && custom.generatedAt === direct.generatedAt
          }, null, 2));
          for (const [name, meta] of [['custom', custom], ['direct', direct]]) {
            if (!/^[0-9a-f]{40}$/i.test(String(meta.commitRef || ''))) {
              throw new Error(`${name} no expone un commitRef válido de 40 caracteres.`);
            }
          }
          NODE

      - name: Report response identity headers
        shell: bash
        run: |
          set -euo pipefail
          for target in custom direct; do
            echo "[$target]"
            grep -Ei '^(age|cache-control|date|etag|last-modified|server|x-nf-request-id):' "/tmp/build-meta-headers-${target}" || true
          done
