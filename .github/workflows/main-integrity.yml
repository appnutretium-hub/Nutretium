name: Nutretium Main Integrity Audit

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-pr-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify main commit origin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer $GH_TOKEN"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          curl --fail --silent --show-error "${headers[@]}" \
            "$repo_api/commits/${GITHUB_SHA}/pulls" > /tmp/prs.json
          curl --fail --silent --show-error "${headers[@]}" \
            "$repo_api/commits/${GITHUB_SHA}" > /tmp/commit.json
          node - <<'NODE'
          const fs=require('fs');
          const {classifyCommit}=require('./netlify/lib/main-origin-policy');
          const prs=JSON.parse(fs.readFileSync('/tmp/prs.json','utf8'));
          const commit=JSON.parse(fs.readFileSync('/tmp/commit.json','utf8'));
          const result=classifyCommit({prs,commit,targetBranch:'main'});
          if(!result.allowed){
            const paths=(Array.isArray(commit?.files)?commit.files:[]).map(file=>file?.filename).filter(Boolean).join(', ');
            throw new Error(
              'El commit de main no procede de un PR fusionado ni es una publicación atómica de catálogo permitida. '+
              'Rutas detectadas: '+(paths||'(ninguna)')
            );
          }
          if(result.kind==='merged-pr') console.log('[main-integrity] commit trazable a PR fusionado hacia main:',result.pullRequest||'');
          else console.log('[main-integrity] publicación atómica de catálogo permitida');
          NODE
