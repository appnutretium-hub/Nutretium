name: Nutretium Full Quality Gate
on:
  push:
    # Solo main: alimenta el workflow_run del que depende production-smoke.
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: full-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - name: Build production-equivalent storefront
        run: |
          npm run build:css
          node scripts/staff-login-inject.js
          node scripts/compose-app.js
          node --check app.js
      - name: Core and enterprise tests
        run: |
          npm test
          NUTRETIUM_TEST_MEMORY_BLOBS=true npm run test:redsys
          npm run test:catalogo
          npm run test:pim
          npm run test:customer
          npm run test:security
          npm run test:admin-security
          node scripts/test-zero-trust-security.js
          npm run test:admin
          npm run test:cuentas
          npm run test:passwords
          npm run test:contracts
          npm run test:external-readiness
          npm run test:production-quality
          npm run test:enterprise
      - name: AI, Nexus, workforce and zero-cost regressions
        run: |
          node scripts/test-ai-control-plane.js
          node scripts/test-nexus-core.js
          node scripts/test-enterprise-workforce.js
          node scripts/test-enterprise-workforce-runtime.js
          node scripts/test-zero-cost-policy.js
      - name: Syntax hardening
        run: |
          node --check product-pim.js
          node --check product-variants.js
          node --check producto.js
          node --check wishlist-sync.js
          node --check staff-session-bridge.js
          node --check scripts/build-seo-pages.js
          node --check scripts/compose-app.js
          node --check scripts/test-external-readiness.js
          node --check scripts/test-zero-trust-security.js
          node --check scripts/test-defense-in-depth.js
          node --check scripts/audit-workflow-pinning.js
          node --check scripts/test-nexus-core.js
          node --check scripts/test-enterprise-workforce.js
          node --check scripts/test-enterprise-workforce-runtime.js
          node --check scripts/test-zero-cost-policy.js
          node --check runtime-content.js
          node --check runtime-performance.js
          node --check runtime-guard.js
          node --check cuenta.js
          node --check pedido.js
          node --check settings.js
          node --check netlify/lib/usuarios.js
          node --check netlify/lib/passwords.js
          node --check netlify/lib/rate-limit.js
          node --check netlify/lib/guest-access.js
          node --check netlify/lib/settings.js
          node --check netlify/lib/audit-log.js
          node --check netlify/lib/enterprise-store.js
          node --check netlify/lib/external-readiness.js
          node --check netlify/lib/security-policy.js
          node --check netlify/lib/security-defense.js
          node --check netlify/lib/mfa-replay.js
          node --check netlify/lib/security-step-up.js
          node --check netlify/lib/nexus-core.js
          node --check netlify/lib/enterprise-workforce.js
          node --check netlify/lib/enterprise-workforce-runtime.js
          node --check netlify/lib/zero-cost-policy.js
          node --check netlify/functions/auth.js
          node --check netlify/functions/staff-login.js
          node --check netlify/functions/account-security.js
          node --check netlify/functions/password-reset.js
          node --check netlify/functions/customer-data.js
          node --check netlify/functions/post-sale.js
          node --check netlify/functions/guest-order.js
          node --check netlify/functions/client-error.js
          node --check netlify/functions/site-status.js
          node --check netlify/functions/site-config.js
          node --check netlify/functions/admin-session.js
          node --check netlify/functions/admin-step-up.js
          node --check netlify/functions/admin-audit.js
          node --check netlify/functions/admin-orders.js
          node --check netlify/functions/admin-catalogo.js
          node --check netlify/functions/admin-settings.js
          node --check netlify/functions/admin-status.js
          node --check netlify/functions/admin-external-readiness.js
          node --check netlify/functions/admin-governance.js
          node --check netlify/functions/catalog-quality.js
          node --check netlify/functions/checkout.js
          node --check netlify/functions/refund-redsys.js
          node --check netlify/functions/system-health.js
          node --check netlify/functions/production-sentinel.js
          node --check netlify/functions/platform-backup.js
          node --check netlify/functions/platform-restore.js
          node --check netlify/functions/nexus-status.js
          node --check netlify/functions/workforce-status.js
          node --check netlify/functions/workforce-run.js
          node --check netlify/functions/workforce-worker.js
      - name: Architecture and maximum security audits
        run: |
          node scripts/audit-architecture.js
          node scripts/security-audit.js
          node scripts/security-max-gate.js
          node scripts/audit-workflow-pinning.js
      - name: Build final HTML trust audit
        run: |
          node scripts/trust-inject.js
          node scripts/build-seo-pages.js
          node scripts/build-trust-audit.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start and verify static storefront
        run: |
          node scripts/dev-server.js > /tmp/nutretium-server.log 2>&1 &
          echo $! > /tmp/nutretium-server.pid
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nutretium-server.log
          exit 1
      - name: Browser E2E
        run: npx playwright test tests/e2e-storefront.spec.js tests/e2e-quality.spec.js tests/e2e-critical-flows.spec.js --browser=chromium --workers=1
