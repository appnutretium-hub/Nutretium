    body{background:#0b0b0b;color:#f3f1eb;font-family:Inter,Arial,sans-serif;margin:0}.wrap{max-width:1180px;margin:0 auto;padding:0 20px}.top{border-bottom:1px solid rgba(255,255,255,.07);background:#0e0e0e;position:sticky;top:0;z-index:20}.top .wrap{height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:900;font-size:1.35rem;letter-spacing:-.04em;color:#d4af37;text-decoration:none}.brand span{color:#fff}.back{color:#aaa59a;text-decoration:none;font-size:.82rem;font-weight:700}.back:hover{color:#d4af37}.crumb{padding:22px 0 8px;color:#817d75;font-size:.76rem}.crumb a{color:#a9a49a;text-decoration:none}.product{display:grid;grid-template-columns:1fr 1fr;gap:46px;padding:26px 0 58px}.visual{background:linear-gradient(145deg,#141414,#0e0e0e);border:1px solid rgba(255,255,255,.07);border-radius:22px;min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:28px}.visual img{max-width:100%;max-height:470px;object-fit:contain}.gallery{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}.gallery button{width:58px;height:58px;border:1px solid rgba(255,255,255,.1);background:#0d0d0d;border-radius:10px;padding:5px;cursor:pointer}.gallery button.active{border-color:#d4af37}.gallery img{width:100%;height:100%;object-fit:contain}.emoji{font-size:9rem}.eyebrow{color:#d4af37;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:900}.title{font-size:clamp(2rem,4vw,3.4rem);line-height:1.02;letter-spacing:-.05em;margin:12px 0 10px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}.pill{border:1px solid rgba(255,255,255,.09);background:#111;border-radius:999px;padding:7px 10px;font-size:.72rem;color:#aaa59a}.price{font-size:2rem;font-weight:900;margin:8px 0 4px}.stock{font-size:.78rem;color:#a8a39a}.stock.ok{color:#b8d9b8}.desc{color:#aaa59a;line-height:1.75;font-size:.95rem;margin:22px 0}.selector-box{margin:22px 0;padding:18px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:#111}.selector-group+.selector-group{margin-top:15px}.selector-label{display:block;font-size:.76rem;font-weight:800;color:#dedbd4;margin-bottom:8px}.variant-grid{display:flex;flex-wrap:wrap;gap:8px}.variant-option{appearance:none;border:1px solid rgba(255,255,255,.1);background:#0d0d0d;color:#d8d4cc;padding:9px 12px;border-radius:10px;font-size:.78rem;font-weight:700;text-decoration:none;cursor:pointer}.variant-option:hover,.variant-option.active{border-color:#d4af37;color:#d4af37;background:rgba(212,175,55,.07)}.variant-option.disabled{opacity:.45;pointer-events:none}.quantity-row{display:flex;align-items:center;gap:10px}.qty-btn{width:42px;height:42px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:#111;color:white;font-size:1.1rem;font-weight:900;cursor:pointer}.qty-input{width:62px;height:42px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:#0d0d0d;color:white;text-align:center;font-weight:800}.buy{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.buy button,.buy a{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border-radius:11px;font-weight:900;font-size:.88rem;text-decoration:none;border:0;cursor:pointer}.primary{background:linear-gradient(180deg,#dfbd4c,#c9a52f);color:#0a0a0a}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{border:1px solid rgba(255,255,255,.1)!important;color:#eee;background:#111!important}.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:26px}.trust div{padding:14px;border:1px solid rgba(255,255,255,.07);border-radius:13px;background:#111}.trust strong{display:block;font-size:.8rem}.trust span{display:block;color:#8e8980;font-size:.7rem;margin-top:4px;line-height:1.4}.details{border-top:1px solid rgba(255,255,255,.07);padding:42px 0 70px}.details h2{font-size:1.55rem;margin:0 0 20px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.detail{padding:17px;border-radius:14px;border:1px solid rgba(255,255,255,.07);background:#111}.detail strong{display:block;font-size:.78rem;margin-bottom:6px}.detail span{display:block;color:#969188;font-size:.79rem;line-height:1.55}.pending{border-color:rgba(212,175,55,.25);background:rgba(212,175,55,.045)}.pending span{color:#b7a66f}.foot{border-top:1px solid rgba(255,255,255,.07);padding:28px 0 45px;color:#77736c;font-size:.72rem;line-height:1.6}.error{padding:80px 20px;text-align:center}.error h1{font-size:2rem}.error p{color:#99948b}.notice{font-size:.75rem;color:#928d84;margin-top:8px}@media(max-width:800px){.product{grid-template-columns:1fr;gap:26px}.visual{min-height:350px}.trust,.detail-grid{grid-template-columns:1fr}.top .wrap{height:64px}.title{font-size:2.2rem}}
