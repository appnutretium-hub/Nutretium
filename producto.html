  <style>
    :root{--gold:#d4af37;--muted:#aaa59a;--line:rgba(255,255,255,.08);--card:#111;--black:#0b0b0b}*{box-sizing:border-box}body{background:var(--black);color:#f3f1eb;font-family:Inter,Arial,sans-serif;margin:0}.wrap{max-width:1200px;margin:0 auto;padding:0 20px}.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);background:rgba(14,14,14,.94);backdrop-filter:blur(12px)}.top .wrap{height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:900;font-size:1.35rem;letter-spacing:-.04em;color:var(--gold);text-decoration:none}.brand span{color:#fff}.back{color:#aaa59a;text-decoration:none;font-size:.82rem;font-weight:700}.back:hover{color:var(--gold)}.crumb{padding:22px 0 8px;color:#817d75;font-size:.76rem}.crumb a{color:#a9a49a;text-decoration:none}.product{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:48px;padding:24px 0 46px}.visual{position:sticky;top:104px;background:linear-gradient(145deg,#141414,#0e0e0e);border:1px solid var(--line);border-radius:24px;min-height:540px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:30px}.visual img{max-width:100%;max-height:485px;object-fit:contain}.emoji{font-size:9rem}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:900}.title{font-size:clamp(2rem,4vw,3.45rem);line-height:1.02;letter-spacing:-.05em;margin:12px 0 10px}.rating-line{display:flex;align-items:center;gap:8px;font-size:.76rem;color:#c7c1b8;margin:8px 0 2px}.stars{color:var(--gold);letter-spacing:.06em}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}.pill{border:1px solid rgba(255,255,255,.09);background:#111;border-radius:999px;padding:7px 10px;font-size:.72rem;color:#aaa59a}.price{font-size:2.05rem;font-weight:900;margin:8px 0 4px}.stock{font-size:.78rem;color:#a8a39a}.stock.ok{color:#b8d9b8}.stock.out{color:#e68a8a}.desc{color:#aaa59a;line-height:1.75;font-size:.95rem;margin:22px 0}.buy-panel{border:1px solid var(--line);background:#0f0f0f;border-radius:18px;padding:16px;margin:20px 0}.buy-row{display:flex;gap:10px;align-items:center}.qty{display:flex;align-items:center;border:1px solid #303030;border-radius:11px;overflow:hidden;background:#0a0a0a}.qty button{width:38px;height:42px;border:0;background:transparent;color:#fff;font-size:1.1rem;cursor:pointer}.qty output{min-width:34px;text-align:center;font-size:.82rem;font-weight:800}.buy{flex:1;display:flex;gap:9px}.buy a,.buy button{flex:1;display:inline-flex;align-items:center;justify-content:center;padding:13px 16px;border-radius:11px;font-weight:900;font-size:.86rem;text-decoration:none;border:0;cursor:pointer}.primary{background:linear-gradient(180deg,#dfbd4c,#c9a52f);color:#0a0a0a}.secondary{border:1px solid rgba(255,255,255,.11)!important;color:#eee;background:#111}.buy-note{font-size:.66rem;color:#79746c;margin:9px 0 0;line-height:1.45}.utility-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.utility-row button{border:1px solid #2d2d2d;background:#111;color:#ddd;border-radius:10px;padding:9px 11px;font-size:.72rem;font-weight:800;cursor:pointer}.utility-row button.is-active{background:var(--gold);color:#090909;border-color:var(--gold)}.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}.trust div{padding:14px;border:1px solid var(--line);border-radius:13px;background:#111}.trust strong{display:block;font-size:.8rem}.trust span{display:block;color:#8e8980;font-size:.7rem;margin-top:4px;line-height:1.4}.details{border-top:1px solid var(--line);padding:42px 0 28px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}.section-head h2{font-size:1.55rem;margin:0}.section-head p{margin:0;color:#8e8980;font-size:.76rem;max-width:520px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.detail{padding:17px;border-radius:14px;border:1px solid var(--line);background:#111}.detail strong{display:block;font-size:.78rem;margin-bottom:6px}.detail span{display:block;color:#969188;font-size:.79rem;line-height:1.55;white-space:pre-line}.pending{grid-column:span 2;border-color:rgba(212,175,55,.25);background:rgba(212,175,55,.045)}.pending span{color:#b7a66f}.related{padding:28px 0 64px}.related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.related-card{display:flex;flex-direction:column;color:#eee;text-decoration:none;border:1px solid var(--line);border-radius:15px;background:#111;overflow:hidden;transition:.18s ease}.related-card:hover{border-color:rgba(212,175,55,.5);transform:translateY(-2px)}.related-visual{height:150px;display:grid;place-items:center;background:#0b0b0b;font-size:3rem;overflow:hidden}.related-visual img{width:100%;height:100%;object-fit:contain;padding:10px}.related-copy{padding:12px}.related-copy strong{display:block;font-size:.76rem;line-height:1.35;min-height:2.1em}.related-copy span{display:block;color:var(--gold);font-size:.82rem;font-weight:900;margin-top:7px}.foot{border-top:1px solid var(--line);padding:28px 0 45px;color:#77736c;font-size:.72rem;line-height:1.6}.error{padding:80px 20px;text-align:center}.error h1{font-size:2rem}.error p{color:#99948b}.mobile-buy{display:none}@media(max-width:900px){.product{grid-template-columns:1fr;gap:26px}.visual{position:relative;top:auto;min-height:380px}.detail-grid{grid-template-columns:repeat(2,1fr)}.related-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.top .wrap{height:64px}.title{font-size:2.2rem}.trust,.detail-grid{grid-template-columns:1fr}.pending{grid-column:auto}.section-head{display:block}.section-head p{margin-top:7px}.related-grid{grid-template-columns:1fr 1fr}.buy-row{align-items:stretch}.buy{flex-direction:column}.mobile-buy{display:block;position:fixed;z-index:40;left:10px;right:10px;bottom:10px}.mobile-buy a{display:flex;justify-content:center;padding:14px;border-radius:12px;background:var(--gold);color:#080808;font-size:.86rem;font-weight:900;text-decoration:none;box-shadow:0 16px 40px rgba(0,0,0,.55)}body{padding-bottom:72px}}
