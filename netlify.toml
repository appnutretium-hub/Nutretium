[build]
  publish = "."
  functions = "netlify/functions"

  # Lo que NO debe salir publicado.
  #
  # publish = "." sirve la carpeta entera, así que todo lo que esté aquí queda
  # accesible por URL. Este comando lo borra de la COPIA que Netlify despliega;
  # tus archivos locales NO se tocan.
  #
  # Importante: el listado del ERP, el Excel y la auditoría llevan precios,
  # stock y datos de proveedor. Publicados serían descargables por cualquiera.
  #
  # El comando hace tres cosas: 1) compila Tailwind a styles.css,
  # 2) añade la capa visual Human Touch, 3) borra de la copia desplegada lo sensible.
  command = """
    npm run build:css &&
    cat human-touch.css >> styles.css &&
    rm -rf \
      'Listado de stock disponible.pdf' \
      'CATALOGO_NUTRETIUM.xlsx' \
      'AUDITORIA_CATALOGO.md' \
      'DESPLIEGUE.md' \
      'PRUEBAS_REDSYS.md' \
      'TODO.md' \
      'CLAUDE.md' \
      'GUIA_ARQUITECTURA_NETLIFY.md' \
      'PROMPT_SISTEMA_CLAUDE.md.md' \
      '.env.example' \
      'test_write.txt' \
      'Nuevo Documento de texto.txt' \
      '_backup_pre_actualizacion' \
      'scripts' \
      '.vscode' \
      '.claude' \
      'sources/01_PNG_MAX_CALIDAD_CON_PVP' \
      'sources/00_CONTROL_CALIDAD.csv' \
      'sources/00_RELACION_IMAGENES_PVP.csv' \
      'sources/LEEME.txt' \
      'sources/PROTEINA 100% WHEY.png' \
      'sources/PROTEINA ISO WHEY.png' \
      'sources/productos/LEEME.md' \
      'sources/productos/NOMBRES_ESPERADOS.csv' \
      'sources/productos/FOTOS_PENDIENTES.md' \
      'sources/_nuevas' \
      'sources/_stock' \
      'sources/_catalogo' \
      'sources/amix_fotos_categoria_nombre_pvp_FINAL_WEB' \
      'src' \
      'tailwind.config.js'
  """
  # No se borran package.json, package-lock.json ni node_modules: Netlify los
  # necesita DESPUÉS de este comando para empaquetar las funciones. No son
  # sensibles, y las reglas de más abajo impiden servirlos.

[build.environment]
  NPM_FLAGS = "--omit=optional"
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAILS"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**", "products-data.js"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https:; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://sis.redsys.es https://sis-t.redsys.es https://sis-t.redsys.es:25443"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/sources/productos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/pago-ok"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/pago-ko"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*.pdf"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.xlsx"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/sources/_*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/_backup_pre_actualizacion/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package*.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/index.html"
  status = 404
  force = true
