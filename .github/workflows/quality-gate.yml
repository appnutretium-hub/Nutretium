name: Nutretium Full Quality Gate
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'hotfix/**', 'hardening/**', 'final-**', 'release/**']
  pull_request:
    branches: [main]
concurrency:
  group: full-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - name: Build exact release artifact
        run: node scripts/build-release.js
      - name: Core tests
        run: |
          npm test
          NUTRETIUM_TEST_MEMORY_BLOBS=true npm run test:redsys
          npm run test:catalogo
          npm run test:pim
          npm run test:customer
          npm run test:security
          npm run test:admin-security
          npm run test:admin
          npm run test:cuentas
          npm run test:passwords
          npm run test:contracts
          npm run test:external-readiness
          npm run test:production-quality
          npm run test:commerce-benefits
          npm run test:merchant-feed
      - name: Architecture and security audits
        run: |
          node scripts/audit-architecture.js
          node scripts/security-audit.js
          node scripts/audit-workflow-pinning.js
          node scripts/audit-csp.js
          node scripts/audit-public-dist.js
      - name: Build final HTML trust audit
        run: node scripts/build-trust-audit.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start exact release artifact
        run: |
          SERVE_DIR=dist node scripts/dev-server.js > /tmp/nutretium-server.log 2>&1 &
          echo $! > /tmp/nutretium-server.pid
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nutretium-server.log
          exit 1
      - name: Browser E2E + release layout
        run: npx playwright test tests/e2e-storefront.spec.js tests/e2e-quality.spec.js tests/e2e-release.spec.js --browser=chromium --workers=1
