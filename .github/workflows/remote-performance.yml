name: Netlify Preview Performance Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - name: Wait for Netlify preview to settle
        shell: bash
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--nutretium.netlify.app
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error "$PREVIEW_URL/" >/dev/null 2>&1; then
              echo 'Preview accesible. Esperando estabilización del despliegue...'
              sleep 30
              curl --fail --silent --show-error "$PREVIEW_URL/" >/dev/null
              exit 0
            fi
            sleep 5
          done
          echo 'El Deploy Preview no quedó accesible a tiempo.' >&2
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe deployed preview
        env:
          E2E_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--nutretium.netlify.app
        run: node scripts/performance-probe.js
