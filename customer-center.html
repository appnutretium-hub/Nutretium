<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CRM de clientes · Nutretium</title><style>:root{--g:#d4af37;--bg:#090909;--p:#111;--line:#2b2718;--t:#f5f2e9;--m:#99938a;--ok:#75ce96;--warn:#e4b85b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 Inter,system-ui,sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.head{display:flex;gap:12px;align-items:center;margin-bottom:16px}.grow{flex:1}.brand{color:var(--g);font-weight:950;letter-spacing:.12em;font-size:11px}.muted{color:var(--m)}input{background:#0b0b0b;color:#fff;border:1px solid #38311b;border-radius:9px;padding:10px;font:inherit;min-width:280px}.layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:14px}.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:16px}.list{max-height:75vh;overflow:auto}.customer{display:block;width:100%;text-align:left;background:#0d0d0d;color:#eee;border:1px solid #252218;border-radius:10px;padding:11px;margin:6px 0;cursor:pointer}.customer.active{border-color:var(--g);background:#18150b}.customer small{display:block;color:var(--m);margin-top:3px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.metric strong{display:block;font-size:22px;margin-top:4px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button,button,.btn{border:1px solid #3e3617;background:#151515;color:#eee;border-radius:8px;padding:8px 11px;font-weight:800;cursor:pointer;text-decoration:none}.tabs button.active{background:var(--g);color:#090909}.tablewrap{overflow:auto;border:1px solid #262219;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:720px}th,td{padding:9px 10px;border-bottom:1px solid #222;text-align:left;vertical-align:top}th{font-size:10px;text-transform:uppercase;color:var(--m)}.pill{display:inline-block;border:1px solid #333;border-radius:999px;padding:3px 7px;font-size:10px;margin:2px}.empty{padding:25px;color:var(--m);text-align:center}@media(max-width:900px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.list{max-height:420px}}@media(max-width:600px){.metrics{grid-template-columns:1fr}.wrap{padding:14px}.head{align-items:flex-start;flex-wrap:wrap}input{min-width:0;width:100%}}</style></head><body><main class="wrap"><div class="head"><div><div class="brand">NUTRETIUM · CRM</div><h1 style="margin:4px 0">Clientes</h1><div class="muted">Pedidos, fidelización, soporte y relación comercial.</div></div><div class="grow"></div><input id="search" type="search" placeholder="Buscar nombre, email o teléfono"><button id="refresh">Actualizar</button></div><div class="layout"><aside class="card"><strong>Clientes</strong><div id="customerList" class="list"></div></aside><section class="card"><div id="empty" class="empty">Selecciona un cliente.</div><div id="detail" style="display:none"><div class="head"><div><h2 id="name" style="margin:0"></h2><div id="contact" class="muted"></div></div><div class="grow"></div><a id="emailLink" class="btn">Email</a></div><div id="metrics" class="metrics"></div><nav class="tabs"><button class="active" data-view="orders">Pedidos</button><button data-view="loyalty">Fidelización</button><button data-view="support">Soporte</button><button data-view="engagement">Interacción</button><button data-view="privacy">Privacidad</button></nav><div id="view"></div></div></section></div><p id="error" style="color:#ed8585"></p></main><script src="/customer-center.js"></script></body></html>
