name: Nutretium Production Smoke

on:
  workflow_run:
    workflows: ["Nutretium Full Quality Gate"]
    types: [completed]
    branches: [main]
  schedule:
    # Cada 6 horas. El smoke que de verdad importa ya lo dispara el workflow_run
    # de arriba tras cada Full Quality Gate correcto en main.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
      AUTO_ROLLBACK_ENABLED: ${{ secrets.AUTO_ROLLBACK_ENABLED }}
      REQUIRE_COMMERCE_LIVE_SMOKE: ${{ secrets.REQUIRE_COMMERCE_LIVE_SMOKE }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify public storefront
        shell: bash
        run: |
          set -euo pipefail
          base="https://nutretium.com"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 30 -D /tmp/headers -o /tmp/home "$base/"
          grep -qi '^x-frame-options: *DENY' /tmp/headers
          grep -qi '^x-content-type-options: *nosniff' /tmp/headers
          grep -qi '^strict-transport-security:' /tmp/headers
          grep -qi '^content-security-policy:' /tmp/headers
          grep -qi '^cross-origin-resource-policy: *same-site' /tmp/headers
          grep -qi 'Nutretium' /tmp/home

      - name: Verify deployed commit identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "SHA esperado no válido: $EXPECTED_SHA" >&2
            exit 1
          fi
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/build-meta "https://nutretium.com/build-meta.json?expected=$EXPECTED_SHA&attempt=$attempt"; then
              deployed_sha="$(node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/build-meta','utf8'));process.stdout.write(String(b.sha||''))")"
              repository="$(node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/build-meta','utf8'));process.stdout.write(String(b.repository||''))")"
              if [[ "$deployed_sha" == "$EXPECTED_SHA" && "$repository" == "appnutretium-hub/Nutretium" ]]; then
                echo "Despliegue verificado: $deployed_sha"
                exit 0
              fi
              echo "Esperando Netlify: publicado=${deployed_sha:-vacío} esperado=$EXPECTED_SHA intento=$attempt/24"
            fi
            sleep 10
          done
          echo "Netlify no publicó el SHA aprobado dentro del tiempo de espera." >&2
          exit 1

      - name: Verify responsible disclosure endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 -o /tmp/security-txt "https://nutretium.com/.well-known/security.txt"
          grep -qi '^Contact: mailto:' /tmp/security-txt
          grep -qi '^Canonical: https://nutretium.com/.well-known/security.txt' /tmp/security-txt

      - name: Verify storefront health and report commerce readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 30 -o /tmp/status "https://nutretium.com/.netlify/functions/site-status"
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/status','utf8'));
          if(body.maintenance!==false || body.storefrontReady!==true) throw new Error('El storefront público no está operativo.');
          if(body.commerceReady===true){
            console.log('[production-smoke] storefront operativo · comercio real preparado');
          }else{
            console.log('[production-smoke] storefront operativo · comercio real aún no activado');
          }
          NODE

      - name: Require rollback controls when commerce is live
        shell: bash
        run: |
          set -euo pipefail
          commerce_ready="$(node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/status','utf8'));process.stdout.write(String(b.commerceReady===true))")"
          if [[ "$commerce_ready" == "true" ]]; then
            if [[ "$AUTO_ROLLBACK_ENABLED" != "true" || -z "$NETLIFY_SITE_ID" || -z "$NETLIFY_API_TOKEN" ]]; then
              echo "Comercio real está activo, pero rollback automático no está configurado." >&2
              exit 1
            fi
          fi

      - name: Require live commerce when explicitly enabled
        if: ${{ env.REQUIRE_COMMERCE_LIVE_SMOKE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/status','utf8'));
          if(body.commerceReady!==true) throw new Error('El gate exige comercio real, pero Redsys/shipping/COMMERCE_LIVE no están preparados.');
          NODE

      - name: Guarded automatic rollback
        if: ${{ failure() && env.AUTO_ROLLBACK_ENABLED == 'true' && env.NETLIFY_SITE_ID != '' && env.NETLIFY_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Production smoke failed; requesting Netlify rollback to previous deploy."
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $NETLIFY_API_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/rollback"
          sleep 5
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 https://nutretium.com/ >/tmp/rollback-home
          grep -qi 'Nutretium' /tmp/rollback-home

      - name: Rollback not configured warning
        if: ${{ failure() && (env.AUTO_ROLLBACK_ENABLED != 'true' || env.NETLIFY_SITE_ID == '' || env.NETLIFY_API_TOKEN == '') }}
        run: echo "Production smoke failed; automatic rollback is not explicitly enabled/configured."
