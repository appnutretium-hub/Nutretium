<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ficha avanzada de producto · Nutretium</title><style>:root{--g:#d4af37;--bg:#090909;--p:#111;--line:#302a16;--t:#f4f1e9;--m:#99938a;--ok:#76ce96;--bad:#ed8282}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.head{display:flex;gap:12px;align-items:center;margin-bottom:18px}.grow{flex:1}.brand{color:var(--g);font-weight:950;letter-spacing:.12em;font-size:11px}.muted{color:var(--m)}.card{background:var(--p);border:1px solid #282318;border-radius:15px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;color:#aaa;font-size:12px;font-weight:800;margin-bottom:5px}input,textarea,select{width:100%;background:#0b0b0b;color:#fff;border:1px solid #38301a;border-radius:9px;padding:10px;font:inherit}textarea{min-height:110px;resize:vertical}button,.btn{border:1px solid #403716;background:#151515;color:#eee;border-radius:9px;padding:10px 14px;font-weight:850;cursor:pointer;text-decoration:none}.primary{background:var(--g);color:#090909;border-color:var(--g)}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:5px 8px;border:1px solid #333;border-radius:999px;font-size:11px}.ok{color:var(--ok)}.bad{color:var(--bad)}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:flex-start;flex-wrap:wrap}}</style><link rel="stylesheet" href="/admin-shell.css"></head><body><main class="wrap"><div class="head"><div><div class="brand">NUTRETIUM · CATÁLOGO</div><h1 style="margin:4px 0">Ficha avanzada de producto</h1><div id="productMeta" class="muted">Cargando…</div></div><div class="grow"></div><a class="btn" href="/admin.html">Volver a productos</a></div><section class="card"><div id="summary" class="meta"></div></section><form id="form"><section class="card"><h2>Presentación comercial</h2><div class="grid"><div class="full"><label>Descripción comercial</label><textarea id="description" maxlength="5000"></textarea></div><div><label>Formato</label><input id="format" maxlength="120" placeholder="Ej. 2 kg"></div><div><label>Tamaño / presentación</label><input id="size" maxlength="120" placeholder="Ej. Bote 2000 g"></div><div><label>EAN / GTIN</label><input id="ean" maxlength="14" inputmode="numeric"></div><div><label>Sabores</label><input id="flavors" placeholder="Chocolate, Vainilla, Fresa"></div></div></section><section class="card"><h2>Información alimentaria / suplementación</h2><div class="grid"><div class="full"><label>Ingredientes</label><textarea id="ingredients" maxlength="8000"></textarea></div><div class="full"><label>Información nutricional</label><textarea id="nutrition" maxlength="8000"></textarea></div><div><label>Alérgenos</label><textarea id="allergens" maxlength="3000"></textarea></div><div><label>Advertencias</label><textarea id="warnings" maxlength="5000"></textarea></div><div class="full"><label>Modo de empleo</label><textarea id="instructions" maxlength="5000"></textarea></div></div></section><section class="card"><h2>SEO y multimedia</h2><div class="grid"><div><label>Título SEO</label><input id="seoTitle" maxlength="80"></div><div><label>Meta descripción</label><input id="metaDescription" maxlength="200"></div><div class="full"><label>Galería (una URL por línea)</label><textarea id="gallery" placeholder="/sources/productos/...\nhttps://..."></textarea></div><div class="full"><label>Vídeo HTTPS</label><input id="video" type="url" maxlength="500"></div></div></section><section class="card"><h2>Venta relacionada</h2><p class="muted">Usa códigos de producto separados por coma. No modifica precios.</p><div class="grid"><div><label>Productos relacionados</label><input id="relatedCodes"></div><div><label>Upsell</label><input id="upsellCodes"></div><div class="full"><label>Cross-sell</label><input id="crossSellCodes"></div></div></section><div class="actions"><span id="status" class="muted"></span><button type="submit" class="primary">Guardar ficha avanzada</button></div></form></main><script src="/products-data.js"></script><script src="/staff-session-bridge.js"></script>
<script src="/product-editor.js"></script><script src="/admin-shell.js"></script></body></html>
